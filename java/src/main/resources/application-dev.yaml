# Local development only (mvn spring-boot:run -Dspring-boot.run.profiles=dev, and mvn spring-boot:test-run).
# Never use these credentials outside a local machine.
spring:
  datasource:
    # Matches the docker run command in java/README.md. Ignored under Testcontainers (@ServiceConnection wins).
    url: jdbc:postgresql://localhost:5432/time_deposit_kata_db
    username: time_deposit_kata_user
    password: time_deposit_kata_password

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
