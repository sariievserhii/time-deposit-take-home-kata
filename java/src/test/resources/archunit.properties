# Import only the analysed classes; don't parse dependencies (JDK, libraries) from the classpath.
# The SQL injection rules match by type name, so they don't need them, and ArchUnit 1.4.1 can't parse
# JDK 26 class files (major version 70) anyway, which would only add warnings to the build.
resolveMissingDependenciesFromClassPath=false
